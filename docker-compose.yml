services:
  postgres:
    image: postgres:16-alpine
    container_name: skincare_clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skincare_clinic
    ports:
      - "5432:5432"
    volumes:
      - skincare_clinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skincare_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skincare_clinic_postgres_data: